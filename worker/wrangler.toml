name = "stationwizard"
main = "src/index.ts"
compatibility_date = "2026-09-08"

# Nur Laufzeitvariablen aus dem Dashboard erhalten, keine Secrets verwalten.
# Dieser Schlüssel muss vor allen TOML-Tabellen stehen.
keep_vars = true

# Access muss auch den direkten Worker und seine Vorschauen schützen.
# Die zusätzliche JWT-Prüfung im Worker sperrt ohne Access-Konfiguration zu.
workers_dev = true
preview_urls = true

[assets]
directory = "../dist/stationwizard/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Fahrzeugmodul (AP-F2). Schema und Migrationen liegen unter worker/migrations/,
# angewendet über die Cloudflare-D1-API. Domäne und Persistenz sind strikt
# getrennt (siehe docs/konzept-fahrzeuge.md) – ein Wechsel bliebe auf diesen
# Block und einen neuen Adapter begrenzt.
[[d1_databases]]
binding = "FAHRZEUGE_DB"
database_name = "stationwizard-fahrzeuge"
database_id = "698facb9-4c99-45de-8879-d262c2144144"

# Benutzerverwaltung (AP-B1). Eigene D1-Datenbank statt FAHRZEUGE_DB, damit
# die Fachdomänen getrennt bleiben; Schema in worker/migrations/0004_benutzer.sql.
[[d1_databases]]
binding = "BENUTZER_DB"
database_name = "stationwizard-benutzer"
database_id = "8d57d55d-8bd2-4701-bbbe-f25a4ee34fa9"

# Workers Logs für Diagnose aktivieren; Traces vorerst deaktiviert.
[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

  [observability.traces]
  enabled = false
  head_sampling_rate = 1

# ACCESS_TEAM_DOMAIN und ACCESS_AUD als Laufzeitvariablen am Worker setzen.
# Kein Platzhalter und kein Entwicklungsschalter im Produktionscode.
# Custom Domain erst nach bestätigter Hostnamenwahl und aktivierter Zone ergänzen.

# Die Excel-Dateifreigabe und der PEP-Ordner sind getrennte Schreibziele.
[[secrets_store_secrets]]
binding = "NEXTCLOUD_BASE_URL"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "NEXTCLOUD_BASE_URL"

[[secrets_store_secrets]]
binding = "NEXTCLOUD_SHARE_TOKEN"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "NEXTCLOUD_SHARE_TOKEN"

[[secrets_store_secrets]]
binding = "NEXTCLOUD_PEP_SHARE_TOKEN"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "NEXTCLOUD_PEP_SHARE_TOKEN"

# Optionale Passwörter nur für passwortgeschützte Freigaben als klassische
# Laufzeit-Secrets setzen: NEXTCLOUD_SHARE_PASSWORD / NEXTCLOUD_PEP_SHARE_PASSWORD.
# Ohne Passwort die Bindings vollständig weglassen (keine Platzhalterwerte).

[[secrets_store_secrets]]
binding = "HIORGSERVER_BASE_URL"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "HIORGSERVER_BASE_URL"

[[secrets_store_secrets]]
binding = "HIORGSERVER_EFS_API_TOKEN"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "HIORGSERVER_EFS_API_TOKEN"

# Öffentlicher HiOrg-Kalenderfeed: die vollständige URL ist selbst das Zugangsdatum,
# weil die Anmeldedaten als Query-Parameter darin stecken. Die Schreibweise
# "CALENDER" ist bewusst so übernommen – das Secret heißt im Store genau so.
[[secrets_store_secrets]]
binding = "HIORGSERVER_CALENDER_FEED"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "HIORGSERVER_CALENDER_FEED"

# Mailversand des Kilometerstandsberichts (AP-S1). Absenderadresse als Secret,
# weil sie zusammen mit dem Token den Versandweg ausmacht; der Anzeigename ist
# eine gewöhnliche Laufzeitvariable und wird am Worker gesetzt
# (MAIL_ABSENDER_NAME, von keep_vars erfasst).
[[secrets_store_secrets]]
binding = "MAIL_ABSENDER"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "MAIL_ABSENDER"

# Zweiter Versandweg über einen HTTP-Anbieter (fester Endpunkt in
# worker/src/mail-versand.ts). Nur nötig, wenn "resend" tatsächlich benutzt
# werden soll; ohne das Secret meldet die Systemkonfiguration den Weg
# ehrlich als nicht verfügbar.
[[secrets_store_secrets]]
binding = "MAIL_API_TOKEN"
store_id = "36762a3b5aa547bea7f547b1d66c30ee"
secret_name = "MAIL_API_TOKEN"

# Versandweg "email-routing" über das send_email-Binding. Bewusst auskommentiert:
# das Binding setzt voraus, dass Email Routing im Konto eingerichtet ist und die
# Zieladresse dort als Zieladresse bestätigt wurde. Solange das nicht der Fall
# ist, würde ein aktives Binding den Worker unnötig an eine nicht vorhandene
# Einrichtung binden. Nach dem Einrichten diese drei Zeilen aktivieren und
# destination_address auf genau die Berichtsadresse setzen, damit das Binding
# nicht an beliebige Adressen senden kann.
# [[send_email]]
# name = "MAIL_ROUTING"
# destination_address = "<BERICHTSADRESSE>"
