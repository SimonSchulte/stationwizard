<mat-toolbar class="dashboard-kopfleiste">
  <mat-icon class="kopfleiste-icon">local_shipping</mat-icon>
  <span class="toolbar-title">Fahrzeuge</span>
  <span class="spacer"></span>
  <button mat-raised-button color="primary" (click)="neuesFahrzeug()">
    <mat-icon>add</mat-icon> Neues Fahrzeug
  </button>
</mat-toolbar>

<div class="dashboard-content">
  @if (listeLaedt()) {
    <p role="status">Fahrzeuge werden geladen …</p>
  }
  @if (listeFehler()) {
    <p class="error-hint" role="alert">{{ listeFehler() }}</p>
  }

  @if (!listeLaedt() && !listeFehler() && fahrzeuge().length === 0) {
    <div class="empty-state">
      <mat-icon class="empty-state-icon">local_shipping</mat-icon>
      <p class="empty-hint">Noch keine Fahrzeuge angelegt.</p>
      <button mat-raised-button color="primary" (click)="neuesFahrzeug()">
        <mat-icon>add</mat-icon> Neues Fahrzeug anlegen
      </button>
    </div>
  }

  @if (fahrzeuge().length > 0) {
    <mat-tab-group [(selectedIndex)]="ausgewaehlterTab">
      <mat-tab label="Übersicht">
        <div class="tab-inhalt">
          <app-fuhrpark-uebersicht />
        </div>
      </mat-tab>

      <mat-tab label="Liste Fahrzeuge">
        <div class="tab-inhalt">
          <app-fahrzeug-liste [eingebettet]="true" />
        </div>
      </mat-tab>

      <mat-tab label="Liste Wartungen">
        <div class="tab-inhalt">
          <app-wartungen-liste [fahrzeuge]="fahrzeuge()" />
        </div>
      </mat-tab>

      <mat-tab label="Kilometerübersicht">
        <div class="tab-inhalt">
          <app-kilometer-uebersicht />
        </div>
      </mat-tab>
    </mat-tab-group>
  }
</div>
