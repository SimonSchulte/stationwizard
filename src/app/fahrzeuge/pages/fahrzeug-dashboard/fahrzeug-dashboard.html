<app-seitenkopf titel="Fahrzeuge" icon="local_shipping">
  <button matButton="filled" (click)="neuesFahrzeug()">
    <mat-icon>add</mat-icon> Neues Fahrzeug
  </button>
</app-seitenkopf>

<div class="dashboard-content">
  @if (listeLaedt()) {
    <app-ladeanzeige text="Fahrzeuge werden geladen …" />
  }
  @if (listeFehler()) {
    <app-meldung art="fehler">{{ listeFehler() }}</app-meldung>
  }

  @if (!listeLaedt() && !listeFehler() && fahrzeuge().length === 0) {
    <app-leerzustand icon="local_shipping" titel="Noch keine Fahrzeuge angelegt.">
      <button leerAktion matButton="filled" (click)="neuesFahrzeug()">
        <mat-icon>add</mat-icon> Neues Fahrzeug anlegen
      </button>
    </app-leerzustand>
  }

  @if (fahrzeuge().length > 0) {
    <app-fuhrpark-uebersicht />
  }
</div>
