<div
  class="karte"
  role="button"
  tabindex="0"
  [attr.aria-pressed]="ausgewaehlt()"
  [class.ausgewaehlt]="ausgewaehlt()"
  [style.--streifen]="streifen()"
  (click)="gewaehlt.emit()"
  (keydown.enter)="taste($event)"
  (keydown.space)="taste($event)"
>
  <span class="streifen" aria-hidden="true"></span>
  <div class="inhalt">
    <div class="kopf">
      <span class="nummer">{{ nummer() }}</span>
      <span class="ort" [attr.aria-label]="ortBeschreibung()">
        <span class="lager" [class.fehlt]="!lager()">{{ lager() || 'Kein Lager' }}</span>
        <span class="pfeil" aria-hidden="true"> → </span>
        <span class="ziel" [class.abgeleitet]="zielAbgeleitet()">{{ ziel() }}</span>
      </span>
      @if (marke(); as m) {
        <span class="marke" [class.neu]="m === 'neu'">{{ m === 'neu' ? 'neu' : 'geändert' }}</span>
      }
    </div>
    <div class="kurztext">{{ kurztext() }}</div>
    <div class="fuss">
      <span
        class="platz"
        [attr.data-zustand]="platz().zustand"
        [attr.aria-label]="platzBeschreibung()"
      >
        @if (platz().zustand === 'zu-voll') {
          <mat-icon class="platz-symbol" aria-hidden="true">warning</mat-icon>
        }
        {{ platz().belegt }} / {{ platz().kapazitaet }}
      </span>
    </div>
  </div>
</div>
