<h2 mat-dialog-title>Einsatz anlegen</h2>
<mat-dialog-content class="inhalt">
  <mat-form-field appearance="outline">
    <mat-label>Titel</mat-label>
    <input
      matInput
      required
      maxlength="200"
      [ngModel]="titel()"
      (ngModelChange)="titel.set($event)"
    />
  </mat-form-field>
  <div class="zeitraum">
    <div class="zeitpunkt">
      <mat-form-field appearance="outline" class="datum-feld">
        <mat-label>Beginn</mat-label>
        <input
          matInput
          [matDatepicker]="beginnDatumPicker"
          [ngModel]="beginnDatum()"
          (ngModelChange)="datumGeaendert('beginn', $event)"
          placeholder="TT.MM.JJJJ"
        />
        <mat-datepicker-toggle matSuffix [for]="beginnDatumPicker" />
        <mat-datepicker #beginnDatumPicker />
      </mat-form-field>
      <mat-form-field appearance="outline" class="zeit-feld">
        <mat-label>Uhrzeit</mat-label>
        <input
          matInput
          [matTimepicker]="beginnZeitPicker"
          [ngModel]="beginnZeit()"
          [disabled]="!beginn()"
          (ngModelChange)="zeitGeaendert('beginn', $event)"
        />
        <mat-timepicker-toggle aria-label="Uhrzeit wählen" matSuffix [for]="beginnZeitPicker" />
        <mat-timepicker #beginnZeitPicker interval="15m" />
      </mat-form-field>
    </div>
    <div class="zeitpunkt">
      <mat-form-field appearance="outline" class="datum-feld">
        <mat-label>Ende</mat-label>
        <input
          matInput
          [matDatepicker]="endeDatumPicker"
          [ngModel]="endeDatum()"
          (ngModelChange)="datumGeaendert('ende', $event)"
          placeholder="TT.MM.JJJJ"
          [errorStateMatcher]="endeFehler"
        />
        <mat-datepicker-toggle matSuffix [for]="endeDatumPicker" />
        <mat-datepicker #endeDatumPicker />
        @if (endeVorBeginn()) {
          <mat-error>Das Ende liegt vor dem Beginn.</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline" class="zeit-feld">
        <mat-label>Uhrzeit</mat-label>
        <input
          matInput
          [matTimepicker]="endeZeitPicker"
          [ngModel]="endeZeit()"
          [disabled]="!ende()"
          (ngModelChange)="zeitGeaendert('ende', $event)"
          [errorStateMatcher]="endeFehler"
        />
        <mat-timepicker-toggle aria-label="Uhrzeit wählen" matSuffix [for]="endeZeitPicker" />
        <mat-timepicker #endeZeitPicker interval="15m" />
      </mat-form-field>
    </div>
  </div>
  <mat-form-field appearance="outline">
    <mat-label>Ort</mat-label>
    <input matInput maxlength="200" [ngModel]="ort()" (ngModelChange)="ort.set($event)" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Abbrechen</button>
  <button matButton="filled" [disabled]="!kannAnlegen()" (click)="anlegen()">Anlegen</button>
</mat-dialog-actions>
