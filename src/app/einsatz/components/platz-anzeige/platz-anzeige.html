<div
  class="balken"
  role="meter"
  aria-label="Belegte Zeilen"
  [attr.aria-valuemin]="0"
  [attr.aria-valuemax]="platz().kapazitaet"
  [attr.aria-valuenow]="platz().belegt"
  [attr.aria-valuetext]="beschreibung()"
>
  <div class="fuellung" [style.width.%]="prozent()"></div>
</div>
<span class="text">{{ platz().belegt }} von {{ platz().kapazitaet }} Zeilen</span>
