<h2 mat-dialog-title>{{ daten.titel }}</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="feld">
    <mat-label>Datum</mat-label>
    <input
      matInput
      [matDatepicker]="datumPicker"
      [value]="datumWert"
      (dateChange)="datumAktualisieren($event)"
      placeholder="TT.MM.JJJJ"
    />
    <mat-datepicker-toggle matSuffix [for]="datumPicker"></mat-datepicker-toggle>
    <mat-datepicker #datumPicker></mat-datepicker>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Abbrechen</button>
  <button matButton="filled" [disabled]="!datum()" [mat-dialog-close]="datum()">Übernehmen</button>
</mat-dialog-actions>
